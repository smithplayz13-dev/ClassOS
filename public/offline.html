<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>ClassOS | Offline</title>
    <style>
      body {
        margin: 0;
        background: #f7f7f5;
        color: #242631;
        font:
          16px/1.6 Arial,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        max-width: 430px;
        padding: 32px;
      }
      h1 {
        font-size: 28px;
      }
      p {
        color: #656976;
      }
      a {
        display: inline-block;
        background: #3456d8;
        color: #ffffff;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
      }
      strong {
        color: #3456d8;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>ClassOS</strong>
      <h1>A moment offline.</h1>
      <p>
        Your saved work is still in your workspace. Reconnect to load your plan
        and save new changes.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
